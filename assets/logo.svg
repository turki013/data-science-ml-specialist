<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">data-science-ml-specialist</title>
  <desc id="d">Bar chart split by a dashed train/test line with a verified checkmark badge</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="#334155"/>

  <!-- bars: train side -->
  <rect x="22" y="70" width="12" height="28" rx="3" fill="url(#bar)"/>
  <rect x="39" y="54" width="12" height="44" rx="3" fill="url(#bar)"/>
  <rect x="56" y="62" width="12" height="36" rx="3" fill="url(#bar)"/>

  <!-- split line (train / test gap) -->
  <line x1="77" y1="28" x2="77" y2="102" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>

  <!-- bars: held-out side -->
  <rect x="86" y="66" width="12" height="32" rx="3" fill="#475569"/>
  <rect x="103" y="58" width="12" height="40" rx="3" fill="#475569" opacity="0"/>

  <!-- trend line over train side -->
  <polyline points="28,62 45,44 62,52" fill="none" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="28" cy="62" r="3.5" fill="#E2E8F0"/>
  <circle cx="45" cy="44" r="3.5" fill="#E2E8F0"/>
  <circle cx="62" cy="52" r="3.5" fill="#E2E8F0"/>

  <!-- baseline -->
  <line x1="18" y1="102" x2="110" y2="102" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

  <!-- verified badge -->
  <circle cx="98" cy="38" r="14" fill="#10B981"/>
  <path d="M91 38.5 L96.5 44 L106 33" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
