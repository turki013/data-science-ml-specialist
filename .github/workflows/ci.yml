name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The fixtures are generated, and tests/test_example_datasets.py compares them. Failing here means a
      # CSV was edited by hand or the generator changed without regenerating: review the diff, do not rerun.
      - name: Example fixtures match their generator
        run: python examples/make_datasets.py --check

      - name: Run tests
        run: python -m pytest

      # The linter runs on the repo's own README: the one claim it must not fail on is its own.
      - name: README passes the report linter
        run: python scripts/lint_report.py README.md
